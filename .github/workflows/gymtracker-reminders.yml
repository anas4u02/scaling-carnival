# Cron: every 15 minutes, send due GymTracker reminders (iPhone PWA web push).
name: gymtracker-reminders

on:
  schedule:
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send due reminders
        env:
          APP_URL: https://scaling-carnival-mocha.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Skipping: set the CRON_SECRET repository secret."
            exit 0
          fi
          url="${APP_URL%/}/api/cron/reminders"
          code=$(curl -sS -o /tmp/cron-body -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "$url")
          if [ "$code" = "404" ]; then
            echo "Cron route missing at $url. Vercel production is stale or the last deploy failed."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "Cron failed HTTP $code"
            cat /tmp/cron-body
            exit 1
          fi
          cat /tmp/cron-body
